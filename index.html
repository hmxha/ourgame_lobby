  <script>
    window.onload = function () {
      // 阻止双击放大
      var lastTouchEnd = 0;
      document.addEventListener('touchstart', function (event) {
        if (event.touches.length > 1) {
          event.preventDefault();
        }
      });
      document.addEventListener('touchend', function (event) {
        var now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) {
          event.preventDefault();
        }
        lastTouchEnd = now;
      }, false);

      // 阻止双指放大
      document.addEventListener('gesturestart', function (event) {
        event.preventDefault();
      });
      document.body.addEventListener('touchmove', function (event) {
        event.preventDefault()
      }, { passive: false })
    };
  </script>

    /**
     * 数字滚动函数
     * @param {HTMLElement} element 目标元素
     * @param {number} start 起始数字
     * @param {number} end 结束数字
     * @param {number} duration 持续时间（毫秒）
     */
    function animateNumber(element, start, end, duration) {
      const startTime = performance.now();

      // 标准的 ease-in-out 算法
      const easeInOut = (t) => {
        return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
      };

      function update(currentTime) {
        // 计算当前流逝时间占比 (0 到 1)
        let elapsed = (currentTime - startTime) / duration;
        if (elapsed > 1) elapsed = 1;

        // 应用缓动函数
        const progress = easeInOut(elapsed);

        // 计算当前数字并渲染
        const currentNumber = Math.floor(start + (end - start) * progress);
        element.innerText = 'LOADING ' + currentNumber + '%'; // 加上百分号

        if (elapsed < 1) {
          requestAnimationFrame(update);
        }
      }

      requestAnimationFrame(update);
    }
    // 改变进度
    const myText = document.getElementById('prog-text');
    const randomVal = Math.floor(Math.random() * (99 - 96 + 1)) + 96;
    animateNumber(myText, 0, randomVal, 2000); // 1秒从0变到100
