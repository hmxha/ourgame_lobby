  <script>
    window.onload = function () {
      // 阻止双击放大
      var lastTouchEnd = 0;
      document.addEventListener('touchstart', function (event) {
        if (event.touches.length > 1) {
          event.preventDefault();
        }
      });
      document.addEventListener('touchend', function (event) {
        var now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) {
          event.preventDefault();
        }
        lastTouchEnd = now;
      }, false);

      // 阻止双指放大
      document.addEventListener('gesturestart', function (event) {
        event.preventDefault();
      });
      document.body.addEventListener('touchmove', function (event) {
        event.preventDefault()
      }, { passive: false })
    };
  </script>

<style>
    /* 根缩放系数：想再放大就改这里 */
    :root {
        --scale: 1.3;
    }

    /* 页面背景：深色更凸显动画 */
    body {
        /* margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center; */
        background-color: #1a1a2e;
    }

    /* loader-5 核心样式 */
    .loader-5 {
        animation: rotate5 2s infinite;
        height: calc(50px * var(--scale));
        width: calc(50px * var(--scale));
    }
    .loader-5::before,
    .loader-5::after {
        border-radius: 50%;
        content: "";
        display: block;
        height: calc(20px * var(--scale));
        width: calc(20px * var(--scale));
    }
    .loader-5::before {
        animation: ball1 2s infinite;
        background-color: rgb(255 255 255 / 16%);
        box-shadow: calc(30px * var(--scale)) 0 0 #f031ed;
        margin-bottom: calc(10px * var(--scale));
    }
    .loader-5::after {
        animation: ball2 2s infinite;
        background-color: #f031ed;
        box-shadow: calc(30px * var(--scale)) 0 0 rgb(255 255 255 / 16%);
    }

    /* 动画关键帧：整体旋转+缩放 */
    @keyframes rotate5 {
        0%   { transform: rotate(0deg)   scale(calc(0.8 * var(--scale))); }
        50%  { transform: rotate(360deg) scale(calc(1.2 * var(--scale))); }
        100% { transform: rotate(720deg) scale(calc(0.8 * var(--scale))); }
    }

    /* 小球1动画 */
    @keyframes ball1 {
        0%   { box-shadow: calc(30px * var(--scale)) 0 0 #f031ed; }
        50%  { box-shadow: 0 0 0 #f031ed;
              margin-bottom: 0;
              transform: translate(calc(15px * var(--scale)), calc(15px * var(--scale))); }
        100% { box-shadow: calc(30px * var(--scale)) 0 0 #f031ed;
              margin-bottom: calc(10px * var(--scale)); }
    }

    /* 小球2动画 */
    @keyframes ball2 {
        0%   { box-shadow: calc(30px * var(--scale)) 0 0 rgb(255 255 255 / 32%); }
        50%  { box-shadow: 0 0 0 rgb(255 255 255 / 32%);
              margin-top: calc(-20px * var(--scale));
              transform: translate(calc(15px * var(--scale)), calc(15px * var(--scale))); }
        100% { box-shadow: calc(30px * var(--scale)) 0 0 rgb(255 255 255 / 32%);
              margin-top: 0; }
    }
</style>
